<!DOCTYPE html>
<!--
  index.html — the page's SKELETON.
  It's mostly empty on purpose: js/app.js draws each screen into <main>.
  What's here is the stuff that never changes: the bottom tab bar,
  the pop-up message ("toast"), and the script tags.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Fit the phone screen; viewport-fit=cover lets us respect the notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Colors the phone's status bar area to match the app -->
  <meta name="theme-color" content="#0a0a0a">
  <title>Training Tracker</title>

  <!-- "Add to Home Screen" support: opens full-screen like a real app.
       manifest.json describes the app (name, icon, colors) to the phone. -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Training Tracker">
  <!-- Lets the app draw under the iPhone status bar (style.css leaves room) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- The current screen gets drawn in here by app.js -->
  <main id="view" class="app"></main>

  <!-- Short message that slides up after saving (e.g. "New PR!") -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Bottom tab bar. data-view tells app.js which screen to open. -->
  <nav class="tab-bar">
    <div class="tab-bar-inner">
      <button data-action="nav" data-view="home">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        Home
      </button>
      <button data-action="nav" data-view="log">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>
        Log
      </button>
      <button data-action="nav" data-view="history">
        <svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
        History
      </button>
      <button data-action="nav" data-view="progress">
        <svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l5-6 4 3 6-8"/></svg>
        Progress
      </button>
      <button data-action="nav" data-view="backup">
        <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>
        Backup
      </button>
    </div>
  </nav>

  <!-- Hidden file picker used by "Import backup" -->
  <input type="file" id="import-file" accept=".json,application/json" hidden>

  <!-- Scripts load in order: each file can use what the earlier ones defined -->
  <script src="js/storage.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
